name: Compose hygiene

on:
  push:
  pull_request:

jobs:
  glassbox-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: glassbox check --fail-on risky
        run: node packages/cli/bin/glassbox.js check fixtures/compose/pinned.json --fail-on risky
